# Edited in the Control Panel Case Builder
case: Profile form
module: Profile
page: profile
steps:
  - fill:
      element: profile.fullName
      value: "{{data.fullName}}"
  - fill:
      element: profile.email
      value: "{{data.email}}"
  - fill:
      element: profile.phone
      value: "{{data.phone}}"
  - fill:
      element: profile.age
      value: "{{data.age}}"
  - choose:
      element: profile.gender
      value: "{{data.gender}}"
  - select:
      element: profile.country
      value: "{{data.country}}"
  - check:
      element: profile.interests
      value: Music
  - check: profile.newsletter
  - fill:
      element: profile.bio
      value: "{{data.bio}}"
  - click: profile.saveProfile
outcomes:
  success:
    - visible: profile.profileSaved
  error:
    - visible: profile.profileError
data:
  - id: TC-001
    title: profile — valid data
    type: positive
    outcome: success
    fullName: "{{faker.person.fullName}}"
    email: "{{faker.internet.email}}"
    phone: 05{{faker.string.numeric(8)}}
    age: "59"
    gender: Male
    country: Jordan
    bio: "{{faker.lorem.sentence}}"
  - id: TC-NEG-002
    title: fullName left empty
    type: negative
