# Edited in the Control Panel Case Builder
case: Profile — valid data is accepted
type: positive
module: Profile
page: profile
tags:
  - "@regression"
  - "@generated"
steps:
  - fill:
      element: profile.fullName
      value: "{{data.fullName}}"
  - fill:
      element: profile.email
      value: "{{data.email}}"
  - fill:
      element: profile.phone
      value: "{{data.phone}}"
  - fill:
      element: profile.age
      value: "{{data.age}}"
  - choose:
      element: profile.gender
      value: "{{data.gender}}"
  - select:
      element: profile.country
      value: "{{data.country}}"
  - check:
      element: profile.interests
      value: Music
  - check: profile.newsletter
  - fill:
      element: profile.bio
      value: "{{data.bio}}"
  - fill:
      element: profile.visitDate
      value: "{{data.visitDate}}"
  - fill:
      element: profile.endDate
      value: "{{data.endDate}}"
  - fill:
      element: profile.startDate
      value: "{{data.startDate}}"
  - click: profile.saveProfile
outcomes:
  success:
    - visible: profile.profileSaved
