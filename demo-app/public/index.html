<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>QA Demo Shop — Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="login">
  <header><strong>QA Demo Shop</strong></header>
  <form class="card" id="login-form" novalidate>
    <div class="error" data-test="error" role="alert" hidden></div>
    <input id="user-name" name="username" data-test="username" data-i18n-ph="username" autocomplete="off" />
    <input id="password" name="password" type="password" data-test="password" data-i18n-ph="password" />
    <button type="submit" id="login-button" data-test="login-button" data-i18n="login">Login</button>
    <p><a href="#" class="forgot-link" data-i18n="forgot">Forgot password?</a></p>
  </form>
  <script src="/app.js"></script>
</body>
</html>
