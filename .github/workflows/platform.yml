name: platform
# .NET platform API (ADR-0013) and SQL migrations (ADR-0012)
on:
  push:
    paths: ['platform/**', 'db/**', 'deploy/**', '.github/workflows/platform.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build platform/Atimtha.Platform.slnx -c Release
      - run: dotnet test platform/Atimtha.Platform.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: platform-test-results, path: '**/TestResults/*.trx' }

  migrations:
    name: Migrations and row-level security on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: atimtha }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      PGHOST: localhost
      ConnectionStrings__Migrations: Host=localhost;Database=atimtha;Username=atimtha_owner;Password=ci-owner
      Migrations__Path: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Create the owner and application roles (as deploy/postgres/init-roles.sh does)
        env: { PGPASSWORD: postgres }
        run: |
          psql -U postgres -d atimtha -v ON_ERROR_STOP=1 -c "CREATE ROLE atimtha_owner LOGIN BYPASSRLS PASSWORD 'ci-owner'"
          psql -U postgres -d atimtha -v ON_ERROR_STOP=1 -c "CREATE ROLE atimtha_app LOGIN PASSWORD 'ci-app'"
          psql -U postgres -d atimtha -v ON_ERROR_STOP=1 -c "ALTER DATABASE atimtha OWNER TO atimtha_owner"
          psql -U postgres -d atimtha -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE atimtha TO atimtha_app"
      - name: Apply migrations
        run: dotnet run --project platform/src/Atimtha.Api -c Release -- migrate
      - name: Apply again (nothing pending, checksums unchanged)
        run: dotnet run --project platform/src/Atimtha.Api -c Release -- migrate
      - name: Load development seed
        env: { PGPASSWORD: ci-owner }
        run: psql -U atimtha_owner -d atimtha -v ON_ERROR_STOP=1 -f deploy/dev/seed.sql
      - name: Row-level security hides other organisations from the application role
        env: { PGPASSWORD: ci-app }
        run: |
          none=$(psql -U atimtha_app -d atimtha -tAc "SELECT count(*) FROM atimtha.workspace")
          test "$none" = "0" || { echo "expected 0 workspaces without an organisation, got $none"; exit 1; }
          own=$(psql -U atimtha_app -d atimtha -tA -c "SELECT set_config('app.organization_id', (SELECT id::text FROM atimtha.organization WHERE key = 'iltizamtech'), false)" -c "SELECT count(*) FROM atimtha.workspace" | tail -n 1)
          test "$own" = "1" || { echo "expected 1 workspace for iltizamtech, got $own"; exit 1; }
          other=$(psql -U atimtha_app -d atimtha -tA -c "SELECT set_config('app.organization_id', gen_random_uuid()::text, false)" -c "SELECT count(*) FROM atimtha.workspace" | tail -n 1)
          test "$other" = "0" || { echo "expected 0 workspaces for another organisation, got $other"; exit 1; }
      - name: The application role cannot rewrite the audit log
        env: { PGPASSWORD: ci-app }
        run: |
          if psql -U atimtha_app -d atimtha -v ON_ERROR_STOP=1 -c "DELETE FROM atimtha.audit_log"; then
            echo "audit_log DELETE should be refused"; exit 1
          fi
