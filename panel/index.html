:root[data-theme="dark"]{color-scheme:dark;--bg:#10151C;--card:#161D27;--border:#263040;--text:#F5F3EE;--sec:#C9CED6;--muted:#9AA3AF;--accent:#2BC4AE;--accent-ink:#10151C;--chip:#1C2430;--good-ink:#4cc94c;--critical-ink:#f08080;--warn-ink:#f2c14e;--pos:#3987e5;--neg:#d95926}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--sec);max-width:420px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ================= atimtha shell (task-based navigation) ================= */
:root{--r-sm:6px;--r:10px;--r-lg:16px;--ink:#10151C;--warn-bg:#FDF3E3;--bad-bg:#FBEFEA;--ok-bg:#E6F2E9}
:root[data-theme="dark"]{--warn-bg:#3a2d14;--bad-bg:#3a1f17;--ok-bg:#16301f}
body{font-size:14px}
:lang(ar) body,html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,Tahoma,sans-serif;font-size:15px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--card);border-inline-end:1px solid var(--border)}
nav.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:var(--text)}
nav.side .brand .bt{display:flex;flex-direction:column;line-height:1.15}
